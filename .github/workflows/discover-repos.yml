name: Daily RepoRadar discovery

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Discovery source"
        required: false
        default: "all"
      vertical:
        description: "Vertical filter"
        required: false
        default: "all"
      days:
        description: "Lookback window in days"
        required: false
        default: "365"
      limit:
        description: "Max candidates"
        required: false
        default: "60"
      pick:
        description: "Candidate records to queue"
        required: false
        default: "5"
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: write

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GITHUB_TOKEN: ${{ secrets.REPO_RADAR_GITHUB_PAT || secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare Codex drafting queue
        run: |
          npm run daily -- \
            --source "${{ inputs.source || 'all' }}" \
            --vertical "${{ inputs.vertical || 'all' }}" \
            --days "${{ inputs.days || '365' }}" \
            --limit "${{ inputs.limit || '60' }}" \
            --pick "${{ inputs.pick || '5' }}"

      - name: Upload queue artifact
        uses: actions/upload-artifact@v5
        with:
          name: reporadar-daily-queue
          path: .codex/reporadar-daily-queue/latest.json

      # Queue phải nằm trong repo thì bước draft ở local mới chỉ cần git pull.
      # Artifact ở trên giữ lại làm bản lưu theo từng lượt chạy.
      - name: Commit queue
        run: |
          if [ -z "$(git status --porcelain -- .codex/reporadar-daily-queue/latest.json)" ]; then
            echo "Queue không đổi, bỏ qua commit."
            exit 0
          fi
          git config user.name "RepoRadar Bot"
          git config user.email "noreply@altstack.io.vn"
          git add .codex/reporadar-daily-queue/latest.json
          git commit -m "chore: cập nhật queue crawl daily [skip ci]"
          git push
